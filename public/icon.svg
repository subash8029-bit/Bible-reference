<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#291104" />
      <stop offset="100%" stop-color="#1c0b02" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5efe6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#d97706" stroke-opacity="0.3" stroke-width="4" />

  <!-- Radiance Rays -->
  <g opacity="0.15" stroke="#fde68a" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="60" x2="256" y2="100" />
    <line x1="370" y1="100" x2="340" y2="130" />
    <line x1="142" y1="100" x2="172" y2="130" />
    <line x1="410" y1="190" x2="370" y2="200" />
    <line x1="102" y1="190" x2="142" y2="200" />
  </g>

  <!-- Open Bible Base with Shadow -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M 96,350 C 150,336 210,342 256,364 L 256,180 C 210,158 150,152 96,166 Z" fill="url(#pageGrad)" stroke="#e7e0d3" stroke-width="3" />
    <!-- Right Page -->
    <path d="M 416,350 C 362,336 302,342 256,364 L 256,180 C 302,158 362,152 416,166 Z" fill="url(#pageGrad)" stroke="#e7e0d3" stroke-width="3" />
    <!-- Book Spine -->
    <line x1="256" y1="180" x2="256" y2="366" stroke="#b45309" stroke-width="4" />
    <!-- Ribbon Bookmark -->
    <path d="M 256,180 Q 260,280 286,390 L 274,402 L 256,380 L 244,400 Q 252,280 256,180 Z" fill="#dc2626" />
  </g>

  <!-- Scripture Line Marks -->
  <g stroke="#92400e" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <!-- Left lines -->
    <line x1="130" y1="210" x2="220" y2="204" />
    <line x1="130" y1="240" x2="220" y2="234" />
    <line x1="130" y1="270" x2="220" y2="264" />
    <line x1="130" y1="300" x2="190" y2="295" />

    <!-- Right lines -->
    <line x1="292" y1="204" x2="382" y2="210" />
    <line x1="292" y1="234" x2="382" y2="240" />
    <line x1="292" y1="264" x2="382" y2="270" />
    <line x1="322" y1="295" x2="382" y2="300" />
  </g>

  <!-- Cross Symbol floating above Bible -->
  <g filter="url(#shadow)">
    <!-- Vertical beam -->
    <rect x="246" y="70" width="20" height="90" rx="6" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
    <!-- Horizontal beam -->
    <rect x="226" y="96" width="60" height="20" rx="6" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
    <!-- Cross center shine -->
    <circle cx="256" cy="106" r="4" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Bilingual Text Emblem "BIBLE / గ్రంథము" -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#fde68a" letter-spacing="4">
    BIBLE • లేఖనములు
  </text>
</svg>
